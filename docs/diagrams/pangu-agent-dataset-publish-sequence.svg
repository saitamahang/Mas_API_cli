<text class="smallText" x="434.6666666666667" y="847" text-anchor="start">
<tspan x="434.6666666666667" dy="0">validate_training_dataset_ready()</tspan>
</text>
<line class="message" x1="356.6666666666667" y1="912" x2="623.3333333333334" y2="912"/>
